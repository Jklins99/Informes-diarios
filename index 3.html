<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Informe diario fotográfico</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E📷%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#c85a00">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#f4f3f0;--card:#fff;--tx:#1f2328;--mut:#6a6f76;--ac:#c85a00;--ac2:#fff;--bd:#e3e1dc;--sh:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141516;--card:#1e2022;--tx:#eceae6;--mut:#9a9ea5;--bd:#32353a;--ac:#f08a3c;--ac2:#1a1209;--sh:none}}
:root[data-theme="dark"]{--bg:#141516;--card:#1e2022;--tx:#eceae6;--mut:#9a9ea5;--bd:#32353a;--ac:#f08a3c;--ac2:#1a1209;--sh:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:170px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd)}
.top>div{max-width:640px;margin:auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:12.5px}
.pill{background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:3px 11px;font-size:12.5px;font-weight:600;white-space:nowrap}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
label{display:block;font-size:11.5px;color:var(--mut);margin:12px 0 4px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=date],textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;outline:0}
input:focus,textarea:focus{border-color:var(--ac)}
textarea{resize:vertical;min-height:84px}
details summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details summary::after{content:"▾";color:var(--mut)}
details[open] summary::after{content:"▴"}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:13px 16px;background:var(--ac);color:var(--ac2);cursor:pointer;width:100%}
.btn:active{opacity:.85}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.ent{padding:0;overflow:hidden}
.ent .ph{position:relative;aspect-ratio:4/3;background:#0002}
.ent img{width:100%;height:100%;object-fit:contain;display:block;background:#00000012}
.ent .bd{position:absolute;left:10px;top:10px;background:var(--ac);color:var(--ac2);font-weight:700;font-size:12.5px;border-radius:8px;padding:3px 9px}
.ent .b{padding:12px 14px 14px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:var(--mut);font-size:12.5px}
.ic{font:inherit;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:3px 10px;margin-left:5px;cursor:pointer}
.cnt{text-align:right;font-size:11.5px;color:var(--mut);margin-top:3px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar>div{max-width:640px;margin:auto}
#msg{font-size:12.5px;color:var(--mut);text-align:center;min-height:17px;margin-top:6px}
.empty{text-align:center;color:var(--mut);padding:34px 8px;border:1.5px dashed var(--bd);border-radius:14px}
.sec{font-weight:700;font-size:15px;margin-bottom:10px}
.act{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:10px}
.act .hd b{color:var(--ac)}
select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-top:8px}
.act textarea{min-height:60px;margin-top:6px}
</style>
</head>
<body>
<div class="top"><div><div><h1>Informe diario fotográfico</h1><div class="sub" id="fch"></div></div><span class="pill" id="cn">0 fotos</span></div></div>
<main>

<details class="card" id="cfg">
<summary>Datos de la obra</summary>
<label>Área</label><input type="text" id="area">
<label>Nombre del trabajador</label><input type="text" id="trab">
<label>Nota final</label><input type="text" id="nota">
<label>Obra (encabezado del Word)</label><textarea id="obra" rows="4"></textarea>
<label>Contratista</label><input type="text" id="contr">
<label>Título del informe</label><input type="text" id="titulo">
<label>Logo (opcional)</label>
<input type="file" id="logoIn" accept="image/*">
</details>

<div class="card"><label style="margin-top:0">Fecha del reporte</label><input type="date" id="fecha"></div>
<div class="card"><div class="sec">Avances de actividades</div><div id="acts"></div></div>
<div class="sec" style="margin:4px 2px 8px">Evidencia fotográfica</div>
<input type="file" id="fCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fGal" accept="image/*" multiple hidden>

<div id="list"></div>
<div class="card" style="margin-top:18px"><div class="sec">Cierre de mes</div><label style="margin-top:0">Mes</label><input type="month" id="mes"><div class="sub" id="mesInfo" style="margin:8px 0"></div><button class="btn sec" id="zip">📁 Descargar carpetas del mes (.zip)</button></div>
</main>

<div class="bar"><div>
<div class="row"><button class="btn" id="cam">📷 Tomar foto</button><button class="btn sec" id="gal">🖼️ Galería</button></div>
<div class="row" style="margin-top:8px"><button class="btn sec" id="dl">⬇️ Excel</button><button class="btn sec" id="dw">⬇️ Word</button></div>
<div id="msg"></div>
</div></div>

<script>
const $=id=>document.getElementById(id);
const hoy=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const DEF={days:{},area:"OBRAS - SSOMA",trab:"",nota:"SE ADJUNTA EVIDENCIA FOTOGRÁFICA",acts:[{"d": "SE REPORTO CHARLA DE SEGURIDAD EN OBRA", "o": "", "e": "c"}, {"d": "SE SUPERVISA USO DE MALLA DE SEGURIDAD EN VOLQUETES", "o": "", "e": "c"}, {"d": "SE SUPERVISA TRABAJOS DE:\nCONTROL VEHICULAR Y MAQUINARIA PESADA", "o": "", "e": "c"}, {"d": "VERIFICACION DE USO CORRECTO DE EPP's, CORRECTA DISPOSICION DE SEÑALIZACION Y DELIMITACION DE ZONAS DE TRABAJO DURANTE LA JORNADA LABORAL", "o": "", "e": "c"}, {"d": "SE RENUEVA IMPLEMENTOS DE SEGURIDAD A PERSONAL OBRERO", "o": "", "e": "r"}, {"d": "COLOCADO DE CAPUCHONES EN ESTACAS EXPUESTAS FRENTE DE CRECILINO GONZALES", "o": "", "e": "c"}, {"d": "SE REALIZA LIMPIEZA DE LOS TACHOS CON RESIDUOS SÓLIDOS", "o": "", "e": "c"}, {"d": "ORDEN Y LIMPIEZA DE LAS ZONAS DE TRABAJO", "o": "", "e": "c"}],obra:"",contr:"",titulo:"INFORME DIARIO",fecha:hoy(),logo:null,fotos:[]};
let S=JSON.parse(JSON.stringify(DEF));

/* ---------- almacenamiento (IndexedDB: metadatos + una entrada por foto) ---------- */
let db=null,saved=new Set(),tm;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function openDB(){return new Promise(r=>{try{const q=indexedDB.open("informe-diario",2);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains("kv"))d.createObjectStore("kv");if(!d.objectStoreNames.contains("img"))d.createObjectStore("img")};q.onsuccess=()=>r(q.result);q.onerror=()=>r(null);q.onblocked=()=>r(null)}catch(e){r(null)}})}
const req=q=>new Promise(r=>{q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});
const allFotos=()=>[...S.fotos,...Object.values(S.days).flatMap(v=>v.fotos)];
async function load(){db=await openDB();if(!db){msg("⚠ Este navegador no permite guardar datos; descarga antes de cerrar.");return}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  try{const tx=db.transaction(["kv","img"]),g=await req(tx.objectStore("kv").get("s"));
    if(g){const ac=g.acts&&g.acts.length===S.acts.length&&g.v2;S=Object.assign(S,g);if(!ac)S.acts=JSON.parse(JSON.stringify(DEF.acts));S.v2=1;
      const im=tx.objectStore("img");let perdidas=0;
      for(const f of allFotos()){if(!f.d&&f.id){const d=await req(im.get(f.id));if(d){f.d=d;saved.add(f.id)}else perdidas++}}
      S.fotos=S.fotos.filter(f=>f.d);Object.values(S.days).forEach(v=>v.fotos=v.fotos.filter(f=>f.d));
      if(perdidas)msg("⚠ "+perdidas+" foto(s) no se pudieron recuperar del dispositivo")}
  }catch(e){}}
function save(){clearTimeout(tm);tm=setTimeout(persist,400)}
function persist(){if(!db)return;
  const all=allFotos();all.forEach(f=>{if(!f.id)f.id=uid()});
  const st=f=>({id:f.id,w:f.w,h:f.h,hora:f.hora,t:f.t});
  const meta={...S,fotos:S.fotos.map(st),days:Object.fromEntries(Object.entries(S.days).map(([k,v])=>[k,{...v,fotos:v.fotos.map(st)}]))};
  const use=new Set(all.map(f=>f.id));
  try{const tx=db.transaction(["kv","img"],"readwrite"),im=tx.objectStore("img"),nuevos=[];
    tx.objectStore("kv").put(meta,"s");
    all.forEach(f=>{if(!saved.has(f.id)){im.put(f.d,f.id);nuevos.push(f.id)}});
    [...saved].forEach(i=>{if(!use.has(i))im.delete(i)});
    tx.oncomplete=()=>{nuevos.forEach(i=>saved.add(i));[...saved].forEach(i=>{if(!use.has(i))saved.delete(i)})};
    tx.onabort=()=>msg("⚠ No se pudo guardar en el dispositivo (¿poco espacio?)");
  }catch(e){msg("⚠ No se pudo guardar en el dispositivo")}}
const msg=t=>{$("msg").textContent=t||""};

/* ---------- imágenes ---------- */
function shrink(file,max,frame){return new Promise((res,rej)=>{const u=typeof file==="string"?file:URL.createObjectURL(file),im=new Image();
im.onload=()=>{let sx=0,sy=0,sw=im.width,sh=im.height;if(frame){const r=4/3;if(sw/sh>r){const nw=sh*r;sx=(sw-nw)/2;sw=nw}else{const nh=sw/r;sy=(sh-nh)/2;sh=nh}}const k=Math.min(1,max/Math.max(sw,sh)),w=Math.round(sw*k),h=Math.round(sh*k),c=document.createElement("canvas");
c.width=w;c.height=h;c.getContext("2d").drawImage(im,sx,sy,sw,sh,0,0,w,h);URL.revokeObjectURL(u);res({d:c.toDataURL("image/jpeg",.82),w,h})};
im.onerror=rej;im.src=u})}
async function addFiles(fs){msg("Procesando…");let ok=0,mal=0;
  for(const f of fs){try{const p=await shrink(f,1280);S.fotos.push({...p,id:uid(),t:"",hora:new Date().toTimeString().slice(0,5)});ok++}catch(e){mal++}}
  msg(ok+" foto(s) agregada(s)"+(mal?" · ⚠ "+mal+" no se pudo cargar":""));save();render()}

/* ---------- interfaz ---------- */
function render(){const L=$("list");L.textContent="";mesInfo();
$("cn").textContent=S.fotos.length+(S.fotos.length===1?" foto":" fotos");$("fch").textContent=fmtFecha(S.fecha);
if(!S.fotos.length){const e=document.createElement("div");e.className="empty";e.textContent="Aún no hay fotos. Pulsa «Tomar foto» para empezar.";L.append(e);return}
S.fotos.forEach((f,i)=>{const c=document.createElement("div");c.className="card ent";
const ph=document.createElement("div");ph.className="ph";const im=document.createElement("img");im.src=f.d;
const bd=document.createElement("span");bd.className="bd";bd.textContent="Foto N.º "+String(i+1).padStart(2,"0");ph.append(im,bd);
const b=document.createElement("div");b.className="b";
const h=document.createElement("div");h.className="hd";
const n=document.createElement("span");n.textContent="Tomada a las "+f.hora;
const a=document.createElement("span");
[["↑",()=>mv(i,-1)],["↓",()=>mv(i,1)],["✕",x=>del(i,x)]].forEach(([t,fn])=>{const x=document.createElement("button");x.className="ic";x.textContent=t;x.onclick=()=>fn(x);a.append(x)});
h.append(n,a);
b.append(h);c.append(ph,b);L.append(c)})}
function renderActs(){const L=$("acts");L.textContent="";
S.acts.forEach((a,i)=>{const c=document.createElement("div");c.className="act";
const h=document.createElement("div");h.className="hd";const n=document.createElement("b");n.textContent="Ítem "+(i+1);h.append(n);
const d=document.createElement("div");d.textContent=a.d;d.style.cssText="font-size:14px;white-space:pre-line;margin-bottom:2px";
const o=document.createElement("textarea");o.placeholder="Observación y/o sugerencia (descripción)";o.value=a.o;o.oninput=()=>{a.o=o.value;save()};
const e=document.createElement("select");[["c","Culminado"],["p","En proceso"],["r","Restringido"]].forEach(([v,t])=>{const op=document.createElement("option");op.value=v;op.textContent=t;e.append(op)});e.value=a.e;e.onchange=()=>{a.e=e.value;save()};
c.append(h,d,o,e);L.append(c)})}
function mv(i,d){const j=i+d;if(j<0||j>=S.fotos.length)return;[S.fotos[i],S.fotos[j]]=[S.fotos[j],S.fotos[i]];save();render()}
function del(i,x){if(x.dataset.ok){S.fotos.splice(i,1);save();render();return}
  x.dataset.ok=1;x.textContent="¿Borrar?";x.style.cssText="background:#c0392b;color:#fff;border-color:#c0392b";
  setTimeout(()=>{if(x.isConnected){delete x.dataset.ok;x.textContent="✕";x.style.cssText=""}},3000)}
[["obra","obra"],["contr","contr"],["titulo","titulo"],["fecha","fecha"],["area","area"],["trab","trab"],["nota","nota"]].forEach(([id,k])=>$(id).oninput=e=>{if(k==="fecha"){cambiarFecha(e.target.value);return}S[k]=e.target.value;save()});
$("cam").onclick=()=>$("fCam").click();$("gal").onclick=()=>$("fGal").click();
$("fCam").onchange=e=>{addFiles([...e.target.files]);e.target.value=""};
$("fGal").onchange=e=>{addFiles([...e.target.files]);e.target.value=""};
$("logoIn").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{S.logo=await shrink(f,600);save();msg("Logo cargado")}catch(x){}};

/* ---------- generación del .docx ---------- */
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmtFecha=d=>{const m=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];const p=(d||"").split("-");return p.length<3?"":+p[2]+" de "+m[+p[1]-1]+" de "+p[0]};
const run=(t,o={})=>`<w:r><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/>${o.b?"<w:b/>":""}${o.c?`<w:color w:val="${o.c}"/>`:""}<w:sz w:val="${o.s||16}"/><w:szCs w:val="${o.s||16}"/></w:rPr><w:t xml:space="preserve">${esc(t)}</w:t></w:r>`;
const par=(inner,o={})=>`<w:p><w:pPr>${o.pb?"<w:pageBreakBefore/>":""}<w:spacing w:before="${o.sb||0}" w:after="${o.sa||0}"/><w:jc w:val="${o.j||"center"}"/></w:pPr>${inner}</w:p>`;
const draw=(rid,id,cx,cy)=>`<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${id}" name="Imagen ${id}"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${id}" name="img${id}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`;
const fit=(w,h,mw,mh)=>{const k=Math.min(mw/w,mh/h);return[Math.round(w*k),Math.round(h*k)]};
const G="B7B2A8",B=(n,sz,c)=>`<w:${n} w:val="single" w:sz="${sz}" w:space="0" w:color="${c}"/>`;
const shd=c=>`<w:shd w:val="clear" w:color="auto" w:fill="${c}"/>`;
const BOX=[3900000,3100000]; /* marco fijo 4:3 para todas las fotos */

function bloque(f,i,S,hasLogo){
  const [cx,cy]=fit(f.w,f.h,BOX[0],BOX[1]);
  const num=String(i+1).padStart(2,"0");
  const left=par(run("OBRA",{b:1,c:"C85A00",s:15}),{sa:40})+par(run(S.obra),{sa:120})+par(run("CONTRATISTA",{b:1,c:"C85A00",s:15}),{sa:40})+par(run(S.contr),{sa:120})+
    (hasLogo?par(draw("rIdL",900+i,1300000,Math.round(1300000*S.logo.h/S.logo.w)),{sb:80}):"");
  const txt=(f.t||"").replace(/\s*\n\s*/g," ").trim();
  const cap=`<w:p><w:pPr><w:spacing w:before="60" w:after="60"/><w:jc w:val="left"/></w:pPr>${run("Foto N.º "+num+":",{b:1,s:20,c:"C85A00"})}${run("  "+txt,{s:20})}</w:p>`;
  return `<w:tbl><w:tblPr><w:tblW w:w="9367" w:type="dxa"/><w:jc w:val="center"/><w:tblBorders>${B("top",8,"7F7A70")}${B("left",8,"7F7A70")}${B("bottom",8,"7F7A70")}${B("right",8,"7F7A70")}${B("insideH",4,G)}${B("insideV",4,G)}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:top w:w="80" w:type="dxa"/><w:left w:w="100" w:type="dxa"/><w:bottom w:w="80" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid><w:gridCol w:w="2900"/><w:gridCol w:w="6467"/></w:tblGrid>`+
  `<w:tr><w:trPr><w:cantSplit/><w:trHeight w:val="5500" w:hRule="exact"/></w:trPr><w:tc><w:tcPr><w:tcW w:w="2900" w:type="dxa"/>${shd("F7F5F1")}</w:tcPr>${left}</w:tc><w:tc><w:tcPr><w:tcW w:w="6467" w:type="dxa"/>${shd("FAF9F7")}<w:vAlign w:val="center"/></w:tcPr>${par(draw("rIdF"+i,100+i,cx,cy))}</w:tc></w:tr>`+
  `<w:tr><w:trPr><w:cantSplit/><w:trHeight w:val="1000" w:hRule="exact"/></w:trPr><w:tc><w:tcPr><w:tcW w:w="9367" w:type="dxa"/><w:gridSpan w:val="2"/>${shd("F2EFEA")}<w:vAlign w:val="center"/></w:tcPr>${cap}</w:tc></w:tr></w:tbl>`;
}

function actsDocx(S){
  const [y,m,d]=(S.fecha||"").split("-"),X="000000";
  const c=(w,t,o={})=>`<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${o.sp?`<w:gridSpan w:val="${o.sp}"/>`:""}${o.f?shd(o.f):""}<w:vAlign w:val="center"/></w:tcPr>${String(t||"").split("\n").map(l=>par(run(l,{b:o.b,s:o.s||18}),{j:o.j||"left",sb:30,sa:30})).join("")}</w:tc>`;
  const W=[600,3100,2267,1200,1100,1100],tr=x=>`<w:tr><w:trPr><w:cantSplit/></w:trPr>${x}</w:tr>`;
  const rows=tr(c(9367,"AVANCES DE ACTIVIDADES",{sp:6,b:1,j:"center",f:"D9D9D9",s:20}))+
   tr(["ITEM","DESCRIPCIÓN DE LA ACTIVIDAD","OBSERVACIÓN Y/O SUGERENCIA","CULMINADO","EN PROCESO","RESTRINGIDO"].map((t,i)=>c(W[i],t,{b:1,j:"center",f:"D9D9D9",s:17})).join(""))+
   S.acts.map((a,i)=>tr(c(W[0],i+1,{j:"center"})+c(W[1],a.d)+c(W[2],a.o)+["c","p","r"].map((k,j)=>c(W[3+j],a.e===k?"X":"",{j:"center"})).join(""))).join("");
  const bd=["top","left","bottom","right","insideH","insideV"].map(n=>`<w:${n} w:val="single" w:sz="4" w:space="0" w:color="${X}"/>`).join("");
  return par(run("FORMATO DE REPORTE DE ACTIVIDADES DIARIAS ASISTENTE SSOMA",{b:1,s:26}),{sa:0})+par(run("HORARIO REGULAR",{b:1,s:24}),{sa:200})+
   par(run("AREA: ",{b:1,s:20})+run((S.area||"")+"          ",{s:20})+run("FECHA: ",{b:1,s:20})+run(y?`${d}/${m}/${y}`:"",{s:20}),{j:"left",sa:40})+
   par(run("NOMBRE DEL TRABAJADOR: ",{b:1,s:20})+run(S.trab||"",{s:20}),{j:"left",sa:160})+

   par(run("NOTA: ",{b:1,s:20})+run(S.nota||"",{b:1,s:20}),{j:"left",sb:100});
}

async function buildDocx(JSZipLib,S){
  const NS='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"';

    const im=[0,1].filter(k=>S.fotos[i+k]).map(k=>{const f=S.fotos[i+k],[cx,cy]=fit(f.w,f.h,2700000,2146000);return draw("rIdF"+(i+k),100+i+k,cx,cy)}).join(run("    ",{s:20}));
    body+=`<w:p><w:pPr>${i%6===0?"<w:pageBreakBefore/>":""}<w:spacing w:before="${i%6?200:0}" w:after="0"/><w:jc w:val="center"/></w:pPr>${im}</w:p>`}
  
  const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document ${NS}><w:body>${body}<w:p/><w:sectPr><w:headerReference w:type="default" r:id="rIdH"/><w:pgSz w:w="11907" w:h="16840"/><w:pgMar w:top="1500" w:right="1270" w:bottom="900" w:left="1270" w:header="400" w:footer="500" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const fld=c=>`<w:fldSimple w:instr="${c}"><w:r><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/><w:sz w:val="17"/></w:rPr><w:t>1</w:t></w:r></w:fldSimple>`;
  const hdr=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:hdr ${NS}><w:p><w:pPr><w:pBdr><w:bottom w:val="single" w:sz="18" w:space="4" w:color="C85A00"/></w:pBdr><w:tabs><w:tab w:val="right" w:pos="9367"/></w:tabs><w:spacing w:before="0" w:after="0"/></w:pPr>${run(S.titulo||"INFORME DIARIO",{b:1,s:24})}<w:r><w:tab/></w:r>${run(fmtFecha(S.fecha)+"   |   Página ",{s:17,c:"595959"})}${fld("PAGE")}${run(" de ",{s:17,c:"595959"})}${fld("NUMPAGES")}</w:p><w:p><w:pPr><w:spacing w:before="0" w:after="0"/></w:pPr>${run((S.contr||"")+(S.contr&&S.obra?" · ":"")+(S.obra||"").slice(0,110)+((S.obra||"").length>110?"…":""),{s:14,c:"7F7A70"})}</w:p></w:hdr>`;
  let rels=`<Relationship Id="rIdH" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/header" Target="header1.xml"/>`;
  const z=new JSZipLib();
  z.file("[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpeg" ContentType="image/jpeg"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/header1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.header+xml"/></Types>`);
  z.file("_rels/.rels",`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`);
  const b64=d=>d.split(",")[1];

/* ---------- Excel: tabla de avances + tablas de fotos ---------- */
const MES=["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
const PX=w=>Math.trunc(w*7+5),EM=9525,CW=[3.7,6.5,30.1,14,23.1,14.9,14.3,16.7],CL=i=>String.fromCharCode(65+i);
function buildXlsx(JSZipLib,S){
  const rows={},merges=[],breaks=[],pics=[],media=[];
  const R=(r,h)=>{if(!rows[r])rows[r]={h:h||15,c:{}};else if(h)rows[r].h=h;return rows[r]};
  const rich=(v)=>v.map(([t,o])=>`<r><rPr>${o&&o.b?"<b/>":""}<sz val="${o&&o.sz||11}"/>${o&&o.c?`<color rgb="FF${o.c}"/>`:""}<rFont val="Calibri"/></rPr><t xml:space="preserve">${esc(t)}</t></r>`).join("");
  const put=(r,c,s,v)=>{const a=`r="${CL(c)}${r}" s="${s}"`;R(r).c[c]=(v===""||v==null)?`<c ${a}/>`:typeof v==="number"?`<c ${a}><v>${v}</v></c>`:`<c ${a} t="inlineStr"><is>${Array.isArray(v)?rich(v):`<t xml:space="preserve">${esc(v)}</t>`}</is></c>`};
  const span=(r,c1,c2,s,v)=>{put(r,c1,s,v);for(let c=c1+1;c<=c2;c++)put(r,c,s,"");if(c2>c1)merges.push(`${CL(c1)}${r}:${CL(c2)}${r}`)};
  const [y,m,d]=(S.fecha||"2000-01-01").split("-").map(Number),serial=Math.round((Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/864e5);
  R(2,37);span(2,1,7,1,"FORMATO DE REPORTE DE ACTIVIDADES DIARIAS ASISTENTE SSOMA\nHORARIO REGULAR");
  R(4,18);span(4,1,2,2,"AREA:");span(4,3,4,3,S.area||"");put(4,5,2,"FECHA:");span(4,6,7,4,serial);
  R(5,18);span(5,1,2,2,"NOMBRE DEL TRABAJADOR:");span(5,3,4,3,S.trab||"");
  R(7,16);span(7,1,7,5,"AVANCES DE ACTIVIDADES");
  R(8,30);put(8,1,6,"ITEM");span(8,2,3,6,"DESCRIPCIÓN DE LA ACTIVIDAD");put(8,4,6,"OBSERVACIÓN Y/O SUGERENCIA");put(8,5,6,"CULMINADO");put(8,6,6,"EN PROCESO");put(8,7,6,"RESTRINGIDO");
  const est=(t,k)=>(t||"").split("\n").reduce((n,l)=>n+Math.max(1,Math.ceil(l.length/k)),0);
  let r=9,cur=37+18+18+16+30;
  S.acts.filter(a=>a.d.trim()||a.o.trim()).forEach((a,i)=>{const h=Math.max(30,15*Math.max(est(a.d,38),est(a.o,20))+6);R(r,h);cur+=h;
    put(r,1,7,i+1);span(r,2,3,8,a.d);put(r,4,8,a.o);put(r,5,7,a.e==="c"?"X":"");put(r,6,7,a.e==="p"?"X":"");put(r,7,7,a.e==="r"?"X":"");r++});
  R(r,18);put(r,1,12,"NOTA:");span(r,2,7,13,S.nota||"");cur+=18;r+=2;cur+=15;
  const FW=420,FH=334,PH=350,CH=0,hasLogo=false;
  const pos=x=>{let c=1;while(c<7&&x>=PX(CW[c])){x-=PX(CW[c]);c++}return{c,o:x}};
  let id=1;
  for(let i=0;i<S.fotos.length;i+=2){
    if(cur+PH*.75+CH+8>880&&cur>0){breaks.push(r-1);cur=0}
    R(r,PH*.75);R(r+1,8);cur+=PH*.75+8;
    [0,1].forEach(k=>{const f=S.fotos[i+k];if(!f)return;
      const a=pos(k?434:4);
      pics.push(`<xdr:oneCellAnchor><xdr:from><xdr:col>${a.c}</xdr:col><xdr:colOff>${a.o*EM}</xdr:colOff><xdr:row>${r-1}</xdr:row><xdr:rowOff>${8*EM}</xdr:rowOff></xdr:from><xdr:ext cx="${FW*EM}" cy="${FH*EM}"/><xdr:pic><xdr:nvPicPr><xdr:cNvPr id="${++id}" name="Foto ${i+k+1}"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr><xdr:blipFill><a:blip r:embed="rIdF${i+k}"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill><xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${FW*EM}" cy="${FH*EM}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr></xdr:pic><xdr:clientData/></xdr:oneCellAnchor>`);
      media.push([`f${i+k}`,f.d]);
    });
    r+=2}
  const sd=Object.keys(rows).map(Number).sort((a,b)=>a-b).map(k=>`<row r="${k}" ht="${rows[k].h}" customHeight="1">${Object.keys(rows[k].c).map(Number).sort((a,b)=>a-b).map(c=>rows[k].c[c]).join("")}</row>`).join("");
  const last=Math.max(...Object.keys(rows).map(Number));
  const NS='xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
  const sheet=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet ${NS}><sheetPr><pageSetUpPr fitToPage="1"/></sheetPr><dimension ref="A1:H${last}"/><sheetViews><sheetView showGridLines="0" workbookViewId="0"/></sheetViews><sheetFormatPr defaultRowHeight="15"/><cols>${CW.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")}</cols><sheetData>${sd}</sheetData><mergeCells count="${merges.length}">${merges.map(x=>`<mergeCell ref="${x}"/>`).join("")}</mergeCells><pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/><pageSetup paperSize="9" orientation="portrait" fitToWidth="1" fitToHeight="0"/>${breaks.length?`<rowBreaks count="${breaks.length}" manualBreakCount="${breaks.length}">${breaks.map(b=>`<brk id="${b}" max="16383" man="1"/>`).join("")}</rowBreaks>`:""}${pics.length?'<drawing r:id="rId1"/>':""}</worksheet>`;
  const bd=`<border><left style="thin"><color rgb="FF7F7A70"/></left><right style="thin"><color rgb="FF7F7A70"/></right><top style="thin"><color rgb="FF7F7A70"/></top><bottom style="thin"><color rgb="FF7F7A70"/></bottom><diagonal/></border>`;
  const xf=(f,fl,b,h,v,w,nf)=>`<xf numFmtId="${nf||0}" fontId="${f}" fillId="${fl}" borderId="${b}" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"${nf?' applyNumberFormat="1"':""}><alignment horizontal="${h}" vertical="${v}" wrapText="${w?1:0}"/></xf>`;
  const fnt=(b,sz)=>`<font>${b?"<b/>":""}<sz val="${sz}"/><name val="Calibri"/></font>`;
  const fill=c=>`<fill><patternFill patternType="solid"><fgColor rgb="FF${c}"/><bgColor indexed="64"/></patternFill></fill>`;
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="dd/mm/yyyy"/></numFmts><fonts count="4">${fnt(0,11)}${fnt(1,11)}${fnt(1,14)}${fnt(1,10)}</fonts><fills count="6"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>${fill("D9D9D9")}${fill("F7F5F1")}${fill("F2EFEA")}${fill("FAF9F7")}</fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>${bd}</borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="16"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>${xf(2,0,0,"center","center",1)}${xf(1,0,0,"left","center")}${xf(0,0,1,"center","center",1)}${xf(1,0,1,"center","center",0,164)}${xf(1,2,1,"center","center")}${xf(3,2,1,"center","center",1)}${xf(0,0,1,"center","center")}${xf(0,0,1,"left","center",1)}${xf(0,3,1,"center","top",1)}${xf(0,5,1,"center","center")}${xf(0,4,1,"left","center",1)}${xf(1,0,0,"center","center")}${xf(1,0,0,"left","center")}<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment horizontal="left" vertical="top" wrapText="1"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment horizontal="left" vertical="top" wrapText="1" indent="9"/></xf></cellXfs></styleSheet>`;
  const RT="http://schemas.openxmlformats.org/officeDocument/2006/relationships/",PK='xmlns="http://schemas.openxmlformats.org/package/2006/relationships"';
  const nm=(d+" "+MES[m-1]+" regular").slice(0,31);
  const z=new JSZipLib(),b64=x=>x.split(",")[1],F=(n,d,o)=>z.file(n,d,{createFolders:false,...o});
  F("[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpeg" ContentType="image/jpeg"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/><Override PartName="/xl/drawings/drawing1.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/></Types>`);
  F("_rels/.rels",`<?xml version="1.0" encoding="UTF-8"?><Relationships ${PK}><Relationship Id="rId1" Type="${RT}officeDocument" Target="xl/workbook.xml"/></Relationships>`);
  F("xl/workbook.xml",`<?xml version="1.0" encoding="UTF-8"?><workbook ${NS}><bookViews><workbookView/></bookViews><sheets><sheet name="${esc(nm)}" sheetId="1" r:id="rId1"/></sheets><definedNames><definedName name="_xlnm.Print_Area" localSheetId="0">'${esc(nm)}'!$A$1:$H$${last}</definedName></definedNames></workbook>`);
  F("xl/_rels/workbook.xml.rels",`<?xml version="1.0" encoding="UTF-8"?><Relationships ${PK}><Relationship Id="rId1" Type="${RT}worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${RT}styles" Target="styles.xml"/></Relationships>`);
  F("xl/styles.xml",styles);F("xl/worksheets/sheet1.xml",sheet);
  F("xl/worksheets/_rels/sheet1.xml.rels",`<?xml version="1.0" encoding="UTF-8"?><Relationships ${PK}><Relationship Id="rId1" Type="${RT}drawing" Target="../drawings/drawing1.xml"/></Relationships>`);
  let dr="";media.forEach(([n,dd])=>{F(`xl/media/${n}.jpeg`,b64(dd),{base64:true});dr+=`<Relationship Id="rId${n.replace("f","F")}" Type="${RT}image" Target="../media/${n}.jpeg"/>`});

/* cada foto se incrusta en un lienzo de tamaño fijo: en el Word todas las imágenes miden lo mismo */
function frame(f){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const W=1560,H=1240,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");x.fillStyle="#FFFFFF";x.fillRect(0,0,W,H);const k=Math.min(W/im.width,H/im.height),w=im.width*k,h=im.height*k;x.drawImage(im,(W-w)/2,(H-h)/2,w,h);res({d:c.toDataURL("image/jpeg",.85),w:W,h:H})};im.onerror=rej;im.src=f.d})}
/* Guarda un archivo: usa Claude si está disponible; en GitHub Pages usa una descarga normal del navegador */
async function guardar(nombre,blob){
  const dl=window.claude&&await claude.use("downloads");
  if(dl){await dl.save({filename:nombre,data:blob});return}
  const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=nombre;document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),30000)}
async function exportar(tipo){
  msg("Generando…");
  try{
    const fr=[];for(const f of S.fotos)fr.push({...f,...await frame(f)});
    const T={...S,fotos:fr};
    const z=tipo==="xlsx"?buildXlsx(JSZip,T):await buildDocx(JSZip,T);
    const mime=tipo==="xlsx"?"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":"application/vnd.openxmlformats-officedocument.wordprocessingml.document";
    const blob=await z.generateAsync({type:"blob",mimeType:mime});
    await guardar("REPORTE_DIARIO_"+(S.fecha||"")+"."+tipo,blob);
    msg("Guardado ✓ · "+S.fotos.length+" foto(s) incluidas");
  }catch(e){msg(e&&e.code==="declined"?"Descarga cancelada.":"No se pudo generar el archivo.")}
}
$("dl").onclick=()=>exportar("xlsx");$("dw").onclick=()=>exportar("docx");

/* ---------- historial por día y cierre de mes ---------- */
function cambiarFecha(n){if(!n||n===S.fecha)return;
  S.days[S.fecha]={fotos:S.fotos,acts:S.acts};
  const d=S.days[n];delete S.days[n];S.fecha=n;
  S.fotos=d?d.fotos:[];S.acts=d&&d.acts?d.acts:JSON.parse(JSON.stringify(DEF.acts));
  $("fecha").value=n;save();render();renderActs()}
const todos=()=>({...S.days,[S.fecha]:{fotos:S.fotos}});
const delMes=()=>Object.entries(todos()).filter(([k,v])=>k.startsWith($("mes").value)&&v.fotos.length).sort((a,b)=>a[0]<b[0]?-1:1);
function mesInfo(){const d=delMes(),n=d.reduce((t,[,v])=>t+v.fotos.length,0),e=$("mesInfo");e.style.whiteSpace="pre-line";e.textContent=d.length?d.length+" día(s) · "+n+" foto(s) en total\n"+d.map(([k,v])=>k.split("-").reverse().join("-")+"  →  "+v.fotos.length+" foto(s)").join("\n"):"No hay fotos guardadas en este mes."}
$("mes").oninput=mesInfo;
$("zip").onclick=async()=>{const d=delMes();
  if(!d.length){msg("No hay fotos en ese mes.");return}
  msg("Armando carpetas…");
  try{const z=new JSZip();
    d.forEach(([k,v])=>{const [y,mo,da]=k.split("-"),f=z.folder(da+"-"+mo+"-"+y);v.fotos.forEach((p,i)=>f.file("FOTO_"+String(i+1).padStart(2,"0")+".jpg",p.d.split(",")[1],{base64:true}))});
    const blob=await z.generateAsync({type:"blob"});
    await guardar("FOTOS_"+$("mes").value+".zip",blob);
    msg("Guardado ✓ · "+d.length+" carpeta(s) · "+d.reduce((t,[,v])=>t+v.fotos.length,0)+" foto(s)");
  }catch(e){msg(e&&e.code==="declined"?"Descarga cancelada.":"No se pudo generar el archivo.")}
};

load().then(()=>{["obra","contr","titulo","fecha","area","trab","nota"].forEach(k=>$(k).value=S[k]||"");if(!S.obra)$("cfg").open=true;$("mes").value=S.fecha.slice(0,7);render();renderActs();if(S.fecha!==hoy()){cambiarFecha(hoy());msg("Nuevo día: reporte de hoy")}});
</script>
